# flutter pub run flutter_launcher_icons
#
# Source images are the robot's real product photo (assets/robot_photo.png),
# processed into two icon-ready variants: assets/icon/app_icon.png (opaque
# white background, generous fill — used as-is for iOS/web) and
# assets/icon/app_icon_foreground.png (transparent, smaller fill so it
# survives Android's own adaptive-icon circle/squircle mask).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#CB3C00"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
