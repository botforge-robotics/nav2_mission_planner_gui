name: nav2_mission_planner
description: "Nav2 Mission Planner - A comprehensive ROS2 navigation mission planning application for mobile devices."
version: 2.0.1+1
publish_to: none

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  # ^11: 10.x subclasses IconData, which Flutter 3.47 made a `final class`,
  # breaking the web build entirely. v11 introduces a separate FaIconData
  # type instead, so anything holding a FontAwesome icon is typed FaIconData.
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.1
  std_msgs:
    path: ./lib/plugins/std_msgs
  ros2_api:
    path: ./lib/plugins/ros2_api
  shared_preferences: ^2.5.3
  geometry_msgs:
    path: ./lib/plugins/geometry_msgs
  tf2_msgs:
    path: ./lib/plugins/tf2_msgs
  sensor_msgs:
    path: ./lib/plugins/sensor_msgs
  nav2_mission_planner_interfaces:
    path: ./lib/plugins/nav2_mission_planner_interfaces
  flutter_mjpeg: ^2.0.4
  ros2_msg_utils:
    path: ./lib/plugins/ros2_msg_utils
  nav_msgs:
    path: ./lib/plugins/nav_msgs
  nav2_msgs:
    path: ./lib/plugins/nav2_msgs
  image_gallery_saver:
    path: ./lib/plugins/image_gallery_saver-2.0.3
  permission_handler: ^12.0.0+1
  rosapi_msgs:
    path: ./lib/plugins/rosapi_msgs
  builtin_interfaces:
    path: ./lib/plugins/builtin_interfaces
  uuid: ^4.5.1
  duration_picker: ^1.2.0
  flutter_launcher_icons: ^0.14.4

  # Device and system info (used for device information display)
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  flutter_secure_storage: ^9.0.0
  http: ^0.13.6
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
