services:
  api:
    build: ./server
    image: nav2-mission-planner-api:latest
    # Host networking so LAN scan for rosbridge :9090 can see Wi‑Fi robots
    network_mode: host
    environment:
      API_PORT: "3001"
      DB_PATH: /data/app.db
      SCAN_CIDR: ${SCAN_CIDR:-}
      HEARTBEAT_TIMEOUT_MS: "2500"
    volumes:
      - mission_planner_data:/data
    restart: unless-stopped

  web:
    build: .
    image: nav2-mission-planner-web:latest
    network_mode: host
    environment:
      # nginx listens on WEB_PORT via custom conf; default 8080
      WEB_PORT: ${WEB_PORT:-8080}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mission_planner_data:
